name: Verify

on:
  push:
    branches:
      - main
      - chore/canonical-sync-1.2.1
  pull_request:
  workflow_dispatch:
    inputs:
      build_apk:
        description: Build APK explicitly
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true
      - name: Windows dependencies
        run: flutter pub get
      - name: Windows tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/qa | Out-Null
          flutter test --no-pub --reporter expanded 2>&1 | Tee-Object build/qa/windows-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native Windows PDF and exit scenarios
        shell: pwsh
        run: |
          flutter test integration_test/native_acceptance_test.dart -d windows --reporter expanded 2>&1 | Tee-Object build/qa/windows-native.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $nativeEvidence = Join-Path ([Environment]::GetFolderPath('ApplicationData')) 'KIP Helper/КИП Помощник/kip-acceptance-artifacts'
          if (!(Test-Path -LiteralPath $nativeEvidence)) { throw 'Native PDF evidence was not captured' }
          Copy-Item -LiteralPath $nativeEvidence -Destination build/qa/native -Recurse
      - name: Build ordinary Windows application
        shell: pwsh
        run: |
          flutter build windows --release --target lib/main.dart 2>&1 | Tee-Object build/qa/windows-release.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package and verify single instance
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $crt = Get-ChildItem "$vs/VC/Redist/MSVC/*/x64/Microsoft.VC*.CRT" -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$crt) { throw 'VC Runtime directory not found' }
          $revision = git rev-parse HEAD
          ./scripts/package-windows.ps1 -BuildDirectory build/windows/x64/runner/Release -CrtDirectory $crt.FullName -Version 1.3.0 -Revision $revision
          ./scripts/test-windows-instance.ps1 -Executable "dist/kip-helper-1.3.0-windows-x64-$($revision.Substring(0,7))/kip_helper.exe" -Evidence build/qa/windows-instance.json
      - name: Preserve Windows package
        uses: actions/upload-artifact@v4
        with:
          name: kip-helper-windows-release
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Preserve Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kip-helper-windows-evidence
          path: build/qa/
          retention-days: 14
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        if: github.event_name == 'workflow_dispatch' && inputs.build_apk
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true

      - name: Toolchain
        run: |
          flutter --version
          dart --version
          java -version

      - name: Restore dependencies
        run: flutter pub get

      - name: Preserve resolved dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: resolved-pubspec-lock
          path: pubspec.lock
          retention-days: 7

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze

      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          flutter test --machine | tee /tmp/flutter-test.jsonl
          python3 - <<'PY'
          import json
          import os
          total = passed = failed = skipped = 0
          with open('/tmp/flutter-test.jsonl', encoding='utf-8') as stream:
              for raw in stream:
                  raw = raw.strip()
                  if not raw:
                      continue
                  try:
                      event = json.loads(raw)
                  except json.JSONDecodeError:
                      continue
                  if not isinstance(event, dict):
                      continue
                  if event.get('type') != 'testDone' or event.get('hidden'):
                      continue
                  total += 1
                  result = event.get('result')
                  if result == 'success':
                      passed += 1
                  elif result == 'skipped':
                      skipped += 1
                  else:
                      failed += 1
          if total == 0:
              raise SystemExit('No visible tests were counted from flutter test --machine output')
          summary = f"Flutter tests: total={total}, passed={passed}, skipped={skipped}, failed={failed}"
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write(summary + '\n')
          if failed:
              raise SystemExit(1)
          PY

      - name: Build debug APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_apk
        run: flutter build apk --debug

      - name: Preserve debug APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_apk
        uses: actions/upload-artifact@v4
        with:
          name: kip-helper-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Verify release signing guard
        if: github.event_name == 'workflow_dispatch' && inputs.build_apk
        shell: bash
        run: |
          set +e
          output="$(flutter build apk --release 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$output"
          if [ "$code" -eq 0 ]; then
            echo "Release build unexpectedly succeeded without private signing material." >&2
            exit 1
          fi
          printf '%s\n' "$output" | grep -F "Release signing is not configured. See docs/private-distribution.md"
          echo "Release signing guard refused the unsigned release build as expected." >> "$GITHUB_STEP_SUMMARY"
