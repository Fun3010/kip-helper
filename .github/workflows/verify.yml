name: Verify

on:
  push:
    branches:
      - main
      - chore/canonical-sync-1.2.1
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true

      - name: Toolchain
        run: |
          flutter --version
          dart --version
          java -version

      - name: Restore dependencies
        run: flutter pub get

      - name: Preserve resolved dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: resolved-pubspec-lock
          path: pubspec.lock
          retention-days: 7

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze

      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          flutter test --machine | tee /tmp/flutter-test.jsonl
          python3 - <<'PY'
          import json
          import os
          total = passed = failed = skipped = 0
          with open('/tmp/flutter-test.jsonl', encoding='utf-8') as stream:
              for raw in stream:
                  raw = raw.strip()
                  if not raw:
                      continue
                  try:
                      event = json.loads(raw)
                  except json.JSONDecodeError:
                      continue
                  if not isinstance(event, dict):
                      continue
                  if event.get('type') != 'testDone' or event.get('hidden'):
                      continue
                  total += 1
                  result = event.get('result')
                  if result == 'success':
                      passed += 1
                  elif result == 'skipped':
                      skipped += 1
                  else:
                      failed += 1
          if total == 0:
              raise SystemExit('No visible tests were counted from flutter test --machine output')
          summary = f"Flutter tests: total={total}, passed={passed}, skipped={skipped}, failed={failed}"
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write(summary + '\n')
          if failed:
              raise SystemExit(1)
          PY

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Preserve debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kip-helper-p1-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Verify release signing guard
        shell: bash
        run: |
          set +e
          output="$(flutter build apk --release 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$output"
          if [ "$code" -eq 0 ]; then
            echo "Release build unexpectedly succeeded without private signing material." >&2
            exit 1
          fi
          printf '%s\n' "$output" | grep -F "Release signing is not configured. See docs/private-distribution.md"
          echo "Release signing guard refused the unsigned release build as expected." >> "$GITHUB_STEP_SUMMARY"
